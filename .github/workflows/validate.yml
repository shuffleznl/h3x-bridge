name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shuffleznl/h3x-predictive-dispatch
          path: h3x-predictive-dispatch
      - uses: actions/checkout@v4
        with:
          repository: shuffleznl/h3x-energy-arbitrage
          path: h3x-energy-arbitrage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install current Home Assistant test runtime
        run: python -m pip install homeassistant==2026.10.4 pytest pytest-asyncio PyYAML
      - name: Exercise hostname, signed charge and weather reserve controls
        run: python -m pytest tools/test_runtime_controls.py tools/test_bridge_registry.py -q
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python files
        run: python -m compileall custom_components tools
      - name: Validate Modbus write sequence
        run: python tools/validate_modbus_write_sequence.py
      - name: Validate number entity metadata
        run: python tools/validate_number_metadata.py
      - name: Validate charge command logic
        run: python tools/validate_charge_command_logic.py
      - name: Validate time-slot protocol
        run: python tools/validate_time_slot_protocol.py
      - name: Validate module-count sensor
        run: python tools/validate_module_count_sensor.py
      - name: Validate repository metadata
        run: python tools/validate_repository_metadata.py
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/pylontech_h3x_bridge/manifest.json > /dev/null
          python -m json.tool custom_components/pylontech_h3x_bridge/strings.json > /dev/null
          python -m json.tool custom_components/pylontech_h3x_bridge/translations/en.json > /dev/null
